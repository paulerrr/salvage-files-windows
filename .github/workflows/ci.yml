name: PowerShell checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error,Warning -EnableExit

      - name: Run Pester
        shell: pwsh
        run: |
          Invoke-Pester -Path tests -CI

      - name: Install executable builder
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -RequiredVersion 1.0.18 -Scope CurrentUser -Force

      - name: Build portable executable
        shell: powershell
        run: |
          ./build/Build-PortableExe.ps1 -Version 1.0.0.0

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Rescue-Files-portable
          path: dist/Rescue Files.exe
          if-no-files-found: error
